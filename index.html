<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido | LlankanaWasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            font-family: 'Poppins', sans-serif; 
        }
        .main-card { 
            background: white; 
            padding: 60px; 
            border-radius: 30px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); 
            text-align: center; 
            max-width: 500px;
            width: 90%;
        }
        h1 { font-size: 2.5rem; color: #1a1a1a; margin-bottom: 10px; }
        h1 span { color: #e53935; }
        p { color: #666; margin-bottom: 40px; font-size: 1.1rem; }
        
        .btn-portal { 
            display: block; 
            background: #e53935; 
            color: white; 
            padding: 20px; 
            border-radius: 15px; 
            text-decoration: none; 
            font-size: 1.4rem; 
            font-weight: 800;
            margin-bottom: 20px; 
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(229, 57, 53, 0.3);
        }
        .btn-portal:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(229, 57, 53, 0.4); background: #b71c1c; }
        
        .btn-info { 
            display: inline-block; 
            color: #888; 
            text-decoration: none; 
            font-size: 0.9rem; 
            font-weight: 600;
            border-bottom: 2px solid transparent;
            transition: 0.3s;
        }
        .btn-info:hover { color: #e53935; border-bottom: 2px solid #e53935; }
    </style>
</head>
<body>
    <div class="main-card">
        <h1>LLANKANA<span>WASI</span></h1>
        <p>Tu casa de herramientas para la comprensión lectora.</p>
        
        <a href="TU_LINK_DE_CLASSROOM" class="btn-portal">ACCEDER AL AULA VIRTUAL</a>
        
        <a href="inicio.html" class="btn-info">Conocer más sobre la plataforma →</a>
    </div>
</body>
</html>
