<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Virtual | LlankanaWasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-red: #e53935; --accent-blue: #0091ea; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        /* NAVEGACIÓN SUPERIOR */
        header { 
            background: #000; color: white; padding: 12px 6%; 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 3px solid var(--main-red);
        }
        .logo { font-weight: 800; font-size: 1.4rem; letter-spacing: -1px; }
        .logo span { color: var(--main-red); }
        .nav-right { display: flex; align-items: center; gap: 20px; }
        .nav-right img { height: 25px; filter: brightness(0) invert(1); }
        .btn-top-access { 
            background: var(--main-red); color: white; padding: 8px 18px; 
            border-radius: 4px; text-decoration: none; font-weight: 700; font-size: 0.75rem;
        }

        /* HERO SECTION CON BOTÓN FLOTANTE */
        .hero { 
            position: relative; height: 500px;
            background: url('https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&w=1500&q=80') center/cover;
            display: flex; justify-content: center; align-items: center;
        }
        .hero::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0.3); }

        .floating-pill {
            position: relative; z-index: 2;
            background: linear-gradient(90deg, #00b0ff 0%, #e53935 100%);
            padding: 30px 60px; border-radius: 60px; text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); color: white;
            min-width: 450px;
        }
        .floating-pill h2 { font-size: 1.8rem; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .btn-access-pill { 
            color: white; text-decoration: none; font-weight: 600; font-size: 1rem;
            display: inline-block; border-bottom: 1px solid white; padding-bottom: 2px;
        }

        /* CUADRÍCULA DE SERVICIOS (COMO EN LA IMAGEN) */
        .services-grid { 
            display: grid; grid-template-columns: repeat(5, 1fr); 
            padding: 40px 6%; background: #fff; gap: 15px; margin-top: -30px;
        }
        .service-card { 
            background: white; padding: 25px 15px; text-align: center; 
            border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            transition: 0.3s; z-index: 3; border: 1px solid #eee;
        }
        .service-card:hover { transform: translateY(-5px); border-color: var(--main-red); }
        .service-card i { font-size: 2.2rem; color: #8d191c; margin-bottom: 15px; display: block; }
        .service-card span { font-size: 0.9rem; font-weight: 600; color: #333; line-height: 1.2; display: block; }

        /* FOOTER NEGRO PROFESIONAL */
        footer { background: #111; color: white; padding: 50px 6% 20px; }
        .footer-top { 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid #333; padding-bottom: 30px; margin-bottom: 20px;
        }
        .footer-links a { color: #aaa; text-decoration: none; margin: 0 15px; font-size: 0.85rem; }
        .footer-bottom { display: flex; justify-content: space-between; align-items: center; }
        .partners img { height: 35px; margin-right: 20px; opacity: 0.6; filter: grayscale(1); }
        .socials a { color: #aaa; margin-left: 20px; font-size: 1.4rem; transition: 0.3s; }
        .socials a:hover { color: var(--main-red); }
    </style>
</head>
<body>

    <header>
        <div class="logo">LLANKANA<span>WASI</span></div>
        <div class="nav-right">
            <div style="color:white; font-weight:bold; font-size:1.2rem;">u <span style="font-weight:400">uc</span></div>
            <a href="https://classroom.google.com/c/ODMxNTA3NDg2ODkw?cjc=p4gudiu2" class="btn-top-access">ACCESO ESTUDIANTES</a>
        </div>
    </header>

    <section class="hero">
        <div class="floating-pill">
            <h2>Campus Virtual LlankanaWasi</h2>
            <a href="https://classroom.google.com/c/ODMxNTA3NDg2ODkw?cjc=p4gudiu2" class="btn-access-pill">ACCEDER AL CAMPUS →</a>
        </div>
    </section>

    <div class="services-grid">
        <div class="service-card" onclick="location.href='inicio.html'">
            <i class="fas fa-desktop"></i>
            <span>Asiste a clases</span>
        </div>
        <div class="service-card">
            <i class="fas fa-question-circle"></i>
            <span>Resuelve tus dudas</span>
        </div>
        <div class="service-card">
            <i class="fas fa-th"></i>
            <span>Aprovecha recursos magistrales</span>
        </div>
        <div class="service-card">
            <i class="fas fa-globe"></i>
            <span>Revisa las grabadas</span>
        </div>
        <div class="service-card">
            <i class="fas fa-plus-circle"></i>
            <span>Aulas Virtuales</span>
        </div>
    </div>

    <footer>
        <div class="footer-top">
            <div class="logo">LLANKANA<span>WASI</span></div>
            <nav class="footer-links">
                <a href="recursos.html">Recursos Académicos</a>
                <a href="inicio.html">Nuestra Misión</a>
                <a href="#">Aviso Legal</a>
            </nav>
        </div>
        <div class="footer-bottom">
            <div class="partners">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/Logotipo_de_la_Universidad_de_C%C3%B3rdoba.svg/1200px-Logotipo_de_la_Universidad_de_C%C3%B3rdoba.svg.png" alt="Partner">
                <img src="https://seeklogo.com/images/E/erasmus-logo-B3B1C56816-seeklogo.com.png" alt="Partner">
            </div>
            <div class="socials">
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-tiktok"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
            </div>
        </div>
    </footer>

</body>
</html>
