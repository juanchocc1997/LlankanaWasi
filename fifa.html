<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC26 - Ultra Motion</title>
    <style>
        :root {
            --accent: #00ffcc;
            --bg-dark: #050505;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        /* --- FONDO ANIMADO DE PARTÍCULAS --- */
        #canvas-bg {
            position: fixed;
            top: 0; left: 0;
            z-index: -1;
            filter: blur(80px); /* Esto crea el efecto de luces suaves */
            opacity: 0.6;
        }

        .container {
            display: flex;
            height: 100vh;
            padding: 5% 8%;
            box-sizing: border-box;
            background: radial-gradient(circle at 20% 50%, rgba(0, 255, 204, 0.05) 0%, transparent 50%);
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 10;
        }

        .logo {
            font-size: 3.5rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -3px;
            margin-bottom: 50px;
            animation: slideIn 0.8s ease-out;
        }

        .nav-item {
            font-size: 1.2rem;
            font-weight: 800;
            margin: 12px 0;
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 1px;
        }

        .nav-item:hover, .nav-item.active {
            color: white;
            transform: translateX(25px);
            text-shadow: 0 0 20px var(--accent);
        }

        /* --- CONTENIDO CENTRAL --- */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            animation: fadeIn 1.5s ease;
        }

        .glow-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px var(--accent));
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 2.8rem;
            max-width: 700px;
            line-height: 1.1;
            margin-bottom: 15px;
        }

        .sub {
            color: rgba(255,255,255,0.6);
            margin-bottom: 40px;
        }

        .btn-play {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 15px 35px;
            border-radius: 100px;
            color: white;
            font-weight: bold;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-play:hover {
            background: white;
            color: black;
            transform: scale(1.1);
        }

        /* --- ANIMACIONES --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="container">
        <aside class="sidebar">
            <div class="logo">FC<span style="color:var(--accent)">26</span></div>
            <div class="nav-item">CLUBES</div>
            <div class="nav-item">PATADA INICIAL</div>
            <div class="nav-item active">APRENDE A JUGAR</div>
            <div class="nav-item">TEMPORADAS</div>
            <div class="nav-item">TORNEOS</div>
            <div class="nav-item">AMISTOSOS ONLINE</div>
        </aside>

        <main class="content">
            <div class="glow-icon">🎮</div>
            <h1>El lugar ideal para quienes recién empiezan a jugar FC</h1>
            <p class="sub">Entrenamientos dinámicos • Desafíos • Progresión</p>
            
            <button class="btn-play">
                <span style="border: 1px solid; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 10px;">X</span>
                Expandir Aprende a jugar
            </button>
        </main>
    </div>

    <script>
        // LÓGICA DE LAS LUCES DE FONDO (PARA QUE NO SE VEA NEGRO)
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            for(let i=0; i<5; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 300 + 200,
                    color: i % 2 === 0 ? '#00ffcc' : '#ffffff',
                    dx: (Math.random() - 0.5) * 2,
                    dy: (Math.random() - 0.5) * 2
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                p.x += p.dx;
                p.y += p.dy;
                if(p.x < 0 || p.x > canvas.width) p.dx *= -1;
                if(p.y < 0 || p.y > canvas.height) p.dy *= -1;
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        init();
        animate();
    </script>
</body>
</html>
